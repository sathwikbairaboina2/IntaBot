# Host ports are deliberately non-standard: this machine already runs other
# projects on 8000 (dynamodb) and 9000/9001 (minio). Container-internal ports
# are unchanged.
name: intabot

services:
  dynamodb:
    container_name: intabot-dynamodb
    image: amazon/dynamodb-local:2.5.3
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8200:8000"]

  redis:
    container_name: intabot-redis
    image: redis:7.4-alpine
    ports: ["6479:6379"]

  # IntaBot's own Ollama. It could borrow another project's container, but the
  # newer Qwen weights need a newer Ollama than those are pinned to, and one
  # stack's model upgrade should not be able to break another's.
  ollama:
    container_name: intabot-ollama
    image: ollama/ollama:latest
    ports: ["11437:11434"]
    volumes: ["ollama-models:/root/.ollama"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  minio:
    container_name: intabot-minio
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intabot
      MINIO_ROOT_PASSWORD: intabot-dev-secret
    ports: ["9200:9000", "9201:9001"]
    volumes: ["minio-data:/data"]

volumes:
  minio-data:
  ollama-models:
