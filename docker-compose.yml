# Host ports are deliberately non-standard: this machine already runs other
# projects on 8000 (dynamodb) and 9000/9001 (minio). Container-internal ports
# are unchanged.
name: intabot

services:
  dynamodb:
    container_name: intabot-dynamodb
    image: amazon/dynamodb-local:2.5.3
    # Persistent: data lives in the dynamodb-data volume and survives restarts.
    # The control panel shares this instance (its own table). root lets the image
    # write to the fresh named volume.
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports: ["8200:8000"]
    volumes: ["dynamodb-data:/home/dynamodblocal/data"]

  redis:
    container_name: intabot-redis
    image: redis:7.4-alpine
    ports: ["6479:6379"]

  # No ollama service. The API runs on the host and talks to the Ollama
  # installed there (localhost:11434, the OLLAMA_BASE_URL default), shared by
  # every project on this machine. Pull once on the host:
  #   ollama pull qwen3.8:27b

  minio:
    container_name: intabot-minio
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intabot
      MINIO_ROOT_PASSWORD: intabot-dev-secret
    ports: ["9200:9000", "9201:9001"]
    volumes: ["minio-data:/data"]

volumes:
  dynamodb-data:
  minio-data:
